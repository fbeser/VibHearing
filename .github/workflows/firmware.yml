name: Firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Create CI Wi-Fi configuration
        run: cp include/WifiSecrets.example.h include/WifiSecrets.h

      - name: Build firmware and run native tests
        run: pio run -e seeed_xiao_esp32c3

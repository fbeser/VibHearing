name: Firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Run native signal-processing tests
        run: pio test -e native

      - name: Build XIAO ESP32-C3 firmware
        run: pio run -e seeed_xiao_esp32c3
